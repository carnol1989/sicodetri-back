spring:
  application:
    name: sicodetri
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/sicodetridb
    driverClassName: org.postgresql.Driver
    username: postgres
    password: D%z1dD09L&0L
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update #create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

info:
  project:
    name: @project.name@
    description: @project.description@
    version: @project.version@
    type: core
    artifact-id: @project.artifactId@

server:
  port: 8082

authorization-server:
  provider:
    issuer: "http://localhost:8082"
  jwk:
    key-size: 2048
  client:
    id: sicodetriapp
    secret: eps2025
    redirect-uris:
      - "http://localhost:8082/v1/callback"
      - "http://localhost:3000/callback"
      - "https://oauth.pstmn.io/v1/callback"
    scopes:
      - openid
      - roles
    require-authorization-consent: false
  token:
    access-token-time-to-live: 15m
    refresh-token-time-to-live: 30d
    reuse-refresh-tokens: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.epsgrau.pe.sicodetri: DEBUG
    org:
      hibernate:
        SQL: debug
        type: debug
  file:
    name: sicodetri.log