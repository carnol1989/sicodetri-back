spring:
  application:
    name: sicodetri
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/sicodetridb
    driverClassName: org.postgresql.Driver
    username: postgres
    password: D%z1dD09L&0L
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update #create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

info:
  project:
    name: @project.name@
    description: @project.description@
    version: @project.version@
    type: core
    artifact-id: @project.artifactId@

server:
  port: 8082

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: debug  # Asegúrate de que el nivel general esté en DEBUG
    org:
      hibernate:
        SQL: debug
        type: trace
    com:
      epsgrau:
        pe:
          sicodetri: trace