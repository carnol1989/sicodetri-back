# perf-env.properties

# === Target ===
host=127.0.0.1
port=8082
protocol=http
base_api=/api/v1

# === OAuth2 client (grant: client_credentials) ===
client_id=perf-client
client_secret=perf-secret
token_path=/oauth2/token
scope=roles

# === Carga ===
users=20
rampup=30
duration=300

# === Assertion & Test Plan Config ===
max_resp_ms=12000
testFiles=SICODETRI_LoadTest.jmx

# Archivos
files_dir=target/jmeter/testFiles

# === CSV ===
csv_recycle=false
csv_stop_on_eof=true

# === Secuencialidad global (candado) ===
global_sequential=true

# === Retry 417 (solo temporal) ===
retry_417_max=2
retry_417_base_ms=200