# perf-env.properties

# === Target ===
host=localhost
port=8082
protocol=http
base_api=/api/v1

# === OAuth2 client (grant: client_credentials) ===
client_id=perf-client
client_secret=perf-secret
token_path=/oauth2/token

# === Carga ===
users=20
rampup=30
duration=300

# === Assertion & Test Plan Config ===
max_resp_ms=5000
testFiles=SICODETRI_LoadTest.jmx

# === Weighted Percentages (Opcional, pero recomendado) ===
# Tu JMX los lee, así que es bueno tenerlos aquí
pct_upload_save=10
pct_query=40
pct_proj=15
pct_report=20
pct_tax=15